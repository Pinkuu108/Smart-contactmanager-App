<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(context)">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${title}">Smart Contact Manager</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" th:href="@{/home}">
            Smart Contact Manager
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item"><a class="nav-link" th:href="@{/home}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/login}">Login</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/signup}">Signup</a></li>

            </ul>
        </div>
    </div>
</nav>
<!-- =============== END NAVBAR =============== -->


<!-- ================= PAGE CONTENT ================= -->
<div th:replace="${context}"></div>
<!-- =============== END PAGE CONTENT =============== -->


<!-- ================= FOOTER ================= -->
<footer class="app-footer">
    <div class="container">
        <div class="row align-items-center">

            <div class="col-md-6 text-md-start text-center">
                <span class="footer-brand">Smart Contact Manager</span>
            </div>

            <div class="col-md-6 text-md-end text-center">
                <span class="footer-text">
                    © 2025 · Built with Spring Boot & Thymeleaf
                </span>
            </div>

        </div>
    </div>
</footer>
<!-- =============== END FOOTER =============== -->


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>

</body>
</html>
