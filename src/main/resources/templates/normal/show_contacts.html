<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{normal/base :: layout(~{::section})}">

<head>
<meta charset="UTF-8">
<title>Show Contacts</title>
</head>

<body>
	<section>

		<div class="container mt-3">

			<h2 class="text-center mb-3">Your Contacts</h2>

			<!-- 🔍 SEARCH FORM -->
			<form th:action="@{/user/search}" method="get" class="mb-3">
				<div class="input-group">
					<input type="text" name="query" class="form-control"
						placeholder="Search contact by name" required>
					<button class="btn btn-primary" type="submit">Search</button>
				</div>
			</form>

			<!-- 📋 CONTACT TABLE -->
			<table class="table table-striped table-bordered">
				<thead class="table-dark">
					<tr>
						<th>#ID</th>
						<th>Name</th>
						<th>Email</th>
						<th>Phone</th>
						<th>Image</th>
						<th>Action</th>
					</tr>
				</thead>

				<tbody>
					<tr th:each="c : ${contacts}">
						<td th:text="${c.cId}"></td>
						<td th:text="${c.name}"></td>
						<td th:text="${c.email}"></td>
						<td th:text="${c.phone}"></td>

						<td><img th:src="@{'/img/' + ${c.image}}"
							style="width: 50px; height: 50px; border-radius: 50%;"></td>

						<td><a th:href="@{'/user/update-contact/' + ${c.cId}}"
							class="btn btn-primary btn-sm"> Edit </a> <a
							th:href="@{'/user/delete/' + ${c.cId}}"
							class="btn btn-danger btn-sm"
							onclick="return confirm('Are you sure you want to delete this contact?');">
								Delete </a></td>
					</tr>
				</tbody>
			</table>

		</div>

	</section>
</body>
</html>
