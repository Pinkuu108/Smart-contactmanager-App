<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{normal/base :: layout(~{::section})}">

<head>
<meta charset="UTF-8">
<title>User Dashboard</title>
</head>

<body>

	<section>

		<div class="container mt-4">

			<!-- Welcome Section -->
			<div class="card mb-4 shadow-sm">
				<div class="card-body text-center">
					<h2 class="fw-semibold mb-1">
						Welcome, <span th:text="${user.name}" class="text-primary">User</span>
					</h2>
					<p class="text-muted mb-0">Manage all your contacts securely
						from one place</p>
				</div>
			</div>

			<!-- Action Cards -->
			<div class="row">

				<!-- View Contacts -->
				<div class="col-md-4 mb-3">
					<div class="card h-100 text-center shadow-sm">
						<div class="card-body">
							<div class="mb-3">
								<span
									class="rounded-circle bg-primary text-white p-3 d-inline-block">
									<i class="fas fa-address-card fa-lg"></i>
								</span>
							</div>
							<h5 class="card-title fw-semibold">View Contacts</h5>
							<p class="card-text text-muted">Browse and manage all your
								saved contacts</p>
							<a th:href="@{/user/show-contacts}"
								class="btn btn-outline-primary"> Open </a>
						</div>
					</div>
				</div>

				<!-- Add Contact -->
				<div class="col-md-4 mb-3">
					<div class="card h-100 text-center shadow-sm">
						<div class="card-body">
							<div class="mb-3">
								<span
									class="rounded-circle bg-success text-white p-3 d-inline-block">
									<i class="fas fa-user-plus fa-lg"></i>
								</span>
							</div>
							<h5 class="card-title fw-semibold">Add Contact</h5>
							<p class="card-text text-muted">Save a new contact with photo
								and details</p>
							<a th:href="@{/user/add-contact}" class="btn btn-outline-success">
								Add New </a>
						</div>
					</div>
				</div>

				<!-- Profile -->
				<div class="col-md-4 mb-3">
					<div class="card h-100 text-center shadow-sm">
						<div class="card-body">
							<div class="mb-3">
								<span
									class="rounded-circle bg-warning text-white p-3 d-inline-block">
									<i class="fas fa-id-badge fa-lg"></i>
								</span>
							</div>
							<h5 class="card-title fw-semibold">Your Profile</h5>
							<p class="card-text text-muted">View and manage your account
								information</p>
							<a th:href="@{/user/index}" class="btn btn-outline-warning">
								View Profile </a>
						</div>
					</div>
				</div>

			</div>

		</div>

	</section>

</body>
</html>
