<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{normal/base :: layout(~{::section})}">

<head>
<meta charset="UTF-8">
<title>Contact Detail</title>
</head>

<body>
	<section>

		<div class="container mt-4">

			<div class="card">
				<div class="card-body text-center">

					<img th:src="@{'/img/' + ${contact.image}}"
						style="width: 120px; height: 120px; border-radius: 50%;">

					<h3 class="mt-3" th:text="${contact.name}"></h3>

					<p>
						<b>Email:</b> <span th:text="${contact.email}"></span>
					</p>

					<p>
						<b>Phone:</b> <span th:text="${contact.phone}"></span>
					</p>

					<p>
						<b>Work:</b> <span th:text="${contact.work}"></span>
					</p>

					<p th:text="${contact.description}"></p>

				</div>
			</div>

		</div>

	</section>
</body>
</html>
