<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(context)">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title th:text="${title}">Smart Contact Manager</title>

<!-- Bootstrap CSS -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Font Awesome -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<!-- Custom CSS -->
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" th:href="@{/home}">
            Smart Contact Manager
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home}">HOME</a>
                </li>

                <!-- USER NAME (ONLY WHEN LOGGED IN) -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link disabled">
                        <span th:text="${user.name}">User Name</span>
                    </a>
                </li>

                <!-- LOGOUT (POST) -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit"
                                class="nav-link btn btn-link text-white">
                            LOGOUT
                        </button>
                    </form>
                </li>

            </ul>
        </div>
    </div>
</nav>
<!-- ================= END NAVBAR ================= -->


<!-- ================= SIDEBAR ================= -->
<div class="sidebar" sec:authorize="isAuthenticated()">

    <span onclick="toggleSidebar()" class="crossBtn">&times;</span>

    <a th:href="@{/user/index}" class="item">
        <i class="fas fa-home"></i> Home
    </a>

    <a th:href="@{/user/show-contacts}" class="item">
        <i class="fas fa-address-book"></i> View Contacts
    </a>

    <a th:href="@{/user/add-contact}" class="item">
        <i class="fas fa-user-plus"></i> Add Contact
    </a>

    <a th:href="@{/user/index}" class="item">
        <i class="fas fa-user-circle"></i> Your Profile
    </a>

    <a th:href="@{/user/index}" class="item">
        <i class="fas fa-cog"></i> Settings
    </a>

    <!-- SIDEBAR LOGOUT -->
    <form th:action="@{/logout}" method="post" class="item">
        <button type="submit"
                style="background:none;border:none;color:inherit;width:100%;text-align:left;">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </form>

    <div class="divider"></div>
</div>
<!-- ================= END SIDEBAR ================= -->


<!-- ================= PAGE CONTENT ================= -->
<div class="content">
    <i onclick="toggleSidebar()" class="fas fa-bars m-3"></i>
    <div th:replace="${context}"></div>
</div>
<!-- ================= END PAGE CONTENT ================= -->


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script th:src="@{/js/script.js}"></script>

</body>
</html>
