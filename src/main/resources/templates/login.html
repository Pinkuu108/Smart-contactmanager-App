<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login | Smart Contact Manager</title>

<!-- Bootstrap -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet">

<style>
/* ---------- BODY ---------- */
body {
    min-height: 100vh;
    /* gradient overlay + login background image from static/img/login.jpg */
    background:
        linear-gradient(135deg, rgba(29, 38, 113, 0.75), rgba(195, 55, 100, 0.75)),
        url("/img/login.jpg") no-repeat center center;
    background-size: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
}


/* ---------- CARD ---------- */
.login-card {
    width: 100%;
    max-width: 430px;
    background: #ffffff;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.18);
    border-top: 6px solid #4f46e5;
    animation: fadeIn 0.6s ease-in-out;
}

/* ---------- ANIMATION (FIXED) ---------- */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ---------- HEADINGS ---------- */
.login-title {
    text-align: center;
    font-weight: 600;
    font-size: 26px;
    color: #111827;
    margin-bottom: 6px;
}

.login-subtitle {
    text-align: center;
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 28px;
}

/* ---------- LABELS ---------- */
.form-label {
    font-size: 14px;
    font-weight: 500;
    color: #374151;
}

/* ---------- INPUTS ---------- */
.form-control {
    height: 45px;
    border-radius: 8px;
    font-size: 14px;
    border: 1px solid #d1d5db;
}

.form-control:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 0.18rem rgba(79, 70, 229, 0.25);
}

/* ---------- BUTTON ---------- */
.btn-login {
    height: 46px;
    border-radius: 10px;
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    border: none;
    font-weight: 500;
    letter-spacing: 0.4px;
    transition: all 0.3s ease;
}

.btn-login:hover {
    background: linear-gradient(135deg, #4338ca, #4f46e5);
    transform: translateY(-1px);
}

/* ---------- LINKS ---------- */
.extra-links {
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
    color: #6b7280;
}

.extra-links a {
    color: #4f46e5;
    font-weight: 500;
    text-decoration: none;
}

.extra-links a:hover {
    text-decoration: underline;
}

/* ---------- ALERTS ---------- */
.alert {
    font-size: 14px;
    padding: 8px;
    text-align: center;
}
</style>
</head>

<body>

<div class="login-card">

    <h3 class="login-title">Smart Contact Manager</h3>
    <p class="login-subtitle">Sign in to manage your contacts</p>

    <!-- Login error -->
    <div th:if="${param.error}" class="alert alert-danger">
        Invalid email or password
    </div>

    <!-- Logout success -->
    <div th:if="${param.logout}" class="alert alert-success">
        Logged out successfully
    </div>

    <!-- LOGIN FORM (SPRING SECURITY - UNCHANGED) -->
    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter your password"
                   required>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-login">
                Login
            </button>
        </div>

    </form>

    <!-- REGISTER LINK -->
    <div class="extra-links">
        Don’t have an account?
        <a th:href="@{/signup}">Register here</a>
    </div>

</div>

</body>
</html>
